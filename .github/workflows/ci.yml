name : CI Workflow

on:
    push:
        branches: main
    pull_request:
        branches: main

jobs:
    Node-CI-pipeline:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: 24
            - name: Install dependencies
              run: npm ci
            - name: Run linter
              run: npm run lint
            - name: run unit tests
              run: npm test
            - name: Build application
              run: npm run build

                